singleServerConfig:
  address: "redis://localhost:6381"
  connectionMinimumIdleSize: 10
  connectionPoolSize: 30
  idleConnectionTimeout: 10000
  connectTimeout: 10000
  timeout: 3000
  retryAttempts: 3
  retryInterval: 1500

threads: 4
nettyThreads: 4
codec: !<org.redisson.codec.JsonJacksonCodec> {}
